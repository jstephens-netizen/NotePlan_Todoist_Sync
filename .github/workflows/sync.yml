name: Sync NotePlan to Todoist

on:
  push:
    branches: [main]
    paths:
      - "Notes/**"

  # Hourly instead of every 15 min — push already covers note changes
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

# Cancel in-flight runs on the same branch to avoid state conflicts
concurrency:
  group: noteplan-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install sync tool
        run: pip install .

      - name: Restore sync state
        uses: actions/cache/restore@v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Run sync
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          TODOIST_PROJECT_ID: ${{ secrets.TODOIST_PROJECT_ID }}
          NOTES_DIR: Notes
        run: python -m noteplan_todoist_sync.main

      - name: Save sync state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
